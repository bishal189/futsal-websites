{% load static %}
<section id="gallery" class="py-24 sm:py-28 border-y border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <h2 class="text-3xl sm:text-4xl font-semibold tracking-tight">Gallery</h2>
            <p class="md:max-w-md text-slate-600 leading-relaxed">The courts, the café and match days at Kanakai Futsal.</p>
        </div>

        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 auto-rows-[150px] sm:auto-rows-[200px] gap-3 sm:gap-4">
            <img src="{% static 'winner.jpg' %}" alt="Tournament celebration" loading="lazy" class="col-span-2 row-span-2 w-full h-full object-cover rounded-xl">
            <img src="{% static 'sports.jpeg' %}" alt="Match day" loading="lazy" class="w-full h-full object-cover rounded-xl">
            <img src="{% static 'opening.jpg' %}" alt="Opening day" loading="lazy" class="w-full h-full object-cover rounded-xl">
            <img src="{% static 'trainning.jpg' %}" alt="Training session" loading="lazy" class="w-full h-full object-cover rounded-xl">
            <img src="{% static 'ground.jpg' %}" alt="Match ball on the turf" loading="lazy" class="w-full h-full object-cover rounded-xl">
        </div>
    </div>
</section>
